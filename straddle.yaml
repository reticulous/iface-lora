# iface-lora — LoRa interface for reticulous.
#
# Carries the RadioLib ESP-IDF HAL (esp_idf_hal.cpp/h). Owns the radio IRQ
# line; frames RNS packets with a self-contained 1-byte-header split format
# (≤2 LoRa frames per 500-byte packet). Drives up to CONFIG_LORA_COUNT radios
# on one shared SPI bus, each registering with rnsd as lora/<slot>.
#
# Pins + per-radio type come from this component's own Kconfig (LORA_* /
# LORAn_*), resolved from the buildable's sdkconfig. The board sets them in
# its sdkconfig.defaults; staged-but-inert when CONFIG_LORA_COUNT=0.
schema_version: 1
name: reticulous/iface-lora
prefix: rns_lora
version: 0.0.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - reticulous/rns
# Boot-registered Service: LoraService::onInit() self-registers with rnsd via
# ITS; `requires: reticulous/rns` puts rnsd ahead of it in dependency-topo
# order, so its port surface is up first.
services:
  - { class: LoraService, header: lora.h }
  # LoRaMon LCD viewer: an LcdApp, so this entry installs its launcher tile and
  # runs its boot wiring. when:-gated on spangap-lcd — the whole class lives under
  # conditional/spangap-lcd/, so without the lcd straddle staged neither the
  # trampoline nor the class compiles.
  - { class: LoraMonApp, header: loramon_app.h, when: spangap/spangap-lcd }

# Browser-side UI registration (parallel to init: above) — auto-wired into
# the buildable SPA via straddles.gen.ts; no web-interface edit needed.
browser_register:
  - call: registerLora
    module: modules/lora

# Declarative settings: LCD pane + radio-0 storage defaults generated from this
# block. web: false — LoraPanel.vue keeps the web leaf (IFAC secret, descriptive
# option labels, status badges). Radio 0 only; radios 1.. seeded by the loop in
# lora.cpp. Frequency + TX power carry no default (region/antenna — user must pick).
settings:
  - menu:
      - { id: mesh, label: "Mesh Network", placement: 3 }
      - { id: interfaces, label: "RNS Interfaces", placement: 2 }
      - { id: lora, label: "LoRa" }
    web: false
    rows:
      - section: "LoRa"
      - switch: { label: "Enable", key: "s.lora.0.enable", default: 0 }
      - section: "Radio"
      # Frequency/bandwidth are stored in Hz but entered here in MHz/kHz. These
      # rows bind ephemeral display keys, not s.lora.0.*; lora.cpp mirrors the Hz
      # config to them and converts edits back (so any value works, not presets).
      # Bandwidth's s.lora.0.bandwidth default is seeded in lora.cpp, not here.
      - text: { label: "Frequency (MHz)", key: "lora.0.freq_mhz" }
      - text: { label: "Bandwidth (kHz)", key: "lora.0.bw_khz" }
      - dropdown:
          label: "Spreading"
          key: "s.lora.0.spreading_factor"
          default: 7
          options:
            - { v: 7,  l: "SF7" }
            - { v: 8,  l: "SF8" }
            - { v: 9,  l: "SF9" }
            - { v: 10, l: "SF10" }
            - { v: 11, l: "SF11" }
            - { v: 12, l: "SF12" }
      - dropdown:
          label: "Coding rate"
          key: "s.lora.0.coding_rate"
          default: 5
          options:
            - { v: 5, l: "4/5" }
            - { v: 6, l: "4/6" }
            - { v: 7, l: "4/7" }
            - { v: 8, l: "4/8" }
      - slider: { label: "TX power", key: "s.lora.0.tx_power", min: -9, max: 22 }
      - slider: { label: "Preamble", key: "s.lora.0.preamble", min: 6, max: 32, default: 12 }
      - text:   { label: "Sync word", key: "s.lora.0.sync_word", default: "0x42" }
      # SX126x LNA boosted RX gain: ~+3 dB sensitivity for ~0.4 mA more RX
      # current. On by default; inert on non-SX126x radios.
      - switch: { label: "RX boosted gain", key: "s.lora.0.rx_boosted_gain", default: 1 }
      # Announces this node originates are BUFFERED, never emitted when rnsd
      # hands them over — this interface announces at its own pace. 0 means the
      # beat is off and only `lora a` emits, which is a real "never announces
      # by itself", not a smaller number.
      - slider:
          label: "Announce interval (min)"
          key: "s.lora.0.announce_interval"
          min: 0
          max: 240
          default: 30
      # The value IS the regime number, not a flag: 0 means no frequency
      # agility (the hailing channel alone), 1 is the EU 863-870 MHz nine-channel
      # plan. Off by default — nothing about the node's on-air behaviour changes
      # until it is set.
      - dropdown:
          label: "Frequency agility"
          key: "s.lora.0.afa"
          default: 0
          options:
            - { v: 0, l: "Off" }
            - { v: 1, l: "Regime 1 — EU 863-870" }
      # LoRa defaults to access_point: a radio segment is almost always the
      # edge of the network, and this stops the node re-broadcasting the whole
      # transport network's announces onto the slow RF link. full/gateway are
      # still valid values on this key for anyone who deliberately wants a LoRa
      # backbone — set s.lora.0.mode=gateway by hand — they're just kept out of
      # the picker to avoid people footgunning their airtime.
      - dropdown:
          label: "Mode"
          key: "s.lora.0.mode"
          default: "access_point"
          options:
            - { v: "access_point", l: "Access point" }
            - { v: "roaming",      l: "Roaming" }
            - { v: "boundary",     l: "Boundary" }
      - slider:
          label: "Announce cap %"
          key: "s.lora.0.announce_cap"
          min: 1
          max: 100
          default: 2
      # RNode endpoint: an RNS RNodeInterface client attaches over USB serial
      # and/or TCP 7633 and shares this radio segment. The rest of the group
      # (.radio / .serial / .tcp) is seeded in lora.cpp — one switch is what a
      # pane needs, the ports are a considered choice typed once.
      - section: "RNode endpoint"
      - switch: { label: "Enable", key: "s.lora.rnode.enable", default: 0 }
      - section: "Status"
      - value: { label: "State", key: "lora.0.state" }
      - value: { label: "Chip", key: "lora.0.chip" }
      - value: { label: "Bitrate", key: "lora.0.bitrate_eff" }
      - value: { label: "RSSI", key: "lora.0.stats.rssi_last" }
