# iface-lora — LoRa interface for reticulous.
#
# Carries the RadioLib ESP-IDF HAL (esp_idf_hal.cpp/h). Owns the radio IRQ
# line; frames RNS packets with a self-contained 1-byte-header split format
# (≤2 LoRa frames per 500-byte packet). Drives up to CONFIG_LORA_COUNT radios
# on one shared SPI bus, each registering with rnsd as lora/<slot>.
#
# Pins + per-radio type come from this component's own Kconfig (LORA_* /
# LORAn_*), resolved from the buildable's sdkconfig. The board sets them in
# its sdkconfig.defaults; staged-but-inert when CONFIG_LORA_COUNT=0.
schema_version: 1
name: reticulous/iface-lora
prefix: rns_lora
version: 0.0.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - reticulous/rns
# Boot-registered Service: LoraService::onInit() self-registers with rnsd via
# ITS; `requires: reticulous/rns` puts rnsd ahead of it in dependency-topo
# order, so its port surface is up first.
services:
  - { class: LoraService, header: lora.h }
  # LoRaMon LCD viewer: an LcdApp, so this entry installs its launcher tile and
  # runs its boot wiring. when:-gated on spangap-lcd — the whole class lives under
  # conditional/spangap-lcd/, so without the lcd straddle staged neither the
  # trampoline nor the class compiles.
  - { class: LoraMonApp, header: loramon_app.h, when: spangap/spangap-lcd }
  # Mono-OLED page: radio state, peers/links, last-frame RSSI/SNR. Lives under
  # conditional/tinylcd/, compiled only when tinylcd is staged.
  - { class: LoraTinyPage, header: lora_tiny.h, when: spangap/tinylcd }

# Browser-side UI registration (parallel to init: above) — auto-wired into
# the buildable SPA via straddles.gen.ts; no web-interface edit needed.
browser_register:
  - call: registerLora
    module: modules/lora

# Declarative settings: both surfaces + radio-0 storage defaults generated from
# this block. Radio 0 only; radios 1.. are seeded by the loop in lora.cpp.
# Frequency + TX power carry no default (region/antenna — the user must pick).
settings:
  - at:
      - { id: reticulum }
      - { id: lora, label: "LoRa", short: "LoRa", order: 4 }
    rows:
      - section: "LoRa"
      - caption: "Set frequency and bandwidth directly, pick a spreading factor and coding rate; the radio stays disabled until you enable it."
      - switch: { label: "Enabled", key: "s.lora.0.enable", default: 0 }
      - section: "Radio"
      # Frequency/bandwidth are stored in Hz but entered here in MHz/kHz. These
      # rows bind ephemeral display keys, not s.lora.0.*; lora.cpp mirrors the Hz
      # config to them and converts edits back (so any value works, not presets).
      # Bandwidth's s.lora.0.bandwidth default is seeded in lora.cpp, not here.
      - text: { label: "Frequency (MHz)", key: "lora.0.freq_mhz" }
      - text: { label: "Bandwidth (kHz)", key: "lora.0.bw_khz" }
      - dropdown:
          label: "Spreading"
          key: "s.lora.0.spreading_factor"
          default: 7
          options:
            - { v: 7,  l: "SF7 (fast, short range)" }
            - { v: 8,  l: "SF8" }
            - { v: 9,  l: "SF9" }
            - { v: 10, l: "SF10" }
            - { v: 11, l: "SF11" }
            - { v: 12, l: "SF12 (slow, long range)" }
      - dropdown:
          label: "Coding rate"
          key: "s.lora.0.coding_rate"
          default: 5
          options:
            - { v: 5, l: "4/5" }
            - { v: 6, l: "4/6" }
            - { v: 7, l: "4/7" }
            - { v: 8, l: "4/8" }
      # Max is the ceiling this radio can actually reach at the antenna, which
      # only the device knows: femInit detects whether the board's front-end
      # module is really there and publishes the answer — the part's rating
      # (e.g. 27 on the Heltec V4) when it is, the bare SX126x's 22 when it is
      # not. A board that declares a FEM it cannot talk to therefore offers 22
      # rather than a figure nothing will deliver.
      - slider:
          label: "TX power"
          key: "s.lora.0.tx_power"
          min: -9
          max: { key: "lora.0.tx_power_max", default: 22 }
      - slider: { label: "Preamble", key: "s.lora.0.preamble", min: 6, max: 32, default: 12 }
      - text:   { label: "Sync word", key: "s.lora.0.sync_word", default: "0x42" }
      # LNA boosted RX gain: ~+3 dB sensitivity for ~0.4 mA more RX
      # current. On by default; a flag on SX126x, the top gain level on
      # LR2021, inert on the families that offer neither.
      - switch: { label: "RX boosted gain", key: "s.lora.0.rx_boosted_gain", default: 1 }
      # Analog front-end recalibration. An SX126x that has heard a strong signal
      # can leave its gain control latched and go deaf, and only powering the
      # front end down resets it — so this beat is the one periodic wake the
      # radio task holds without a consumer asking for it. The default matches
      # LORA_AGC_RESET_DEF_S (lora_radio.h); keep the two together.
      - dropdown:
          label: "AGC reset"
          key: "s.lora.0.agc_reset"
          default: 300
          options:
            - { v: 0,   l: "Off" }
            - { v: 60,  l: "Every minute" }
            - { v: 300, l: "Every 5 min" }
            - { v: 900, l: "Every 15 min" }
      # LoRa defaults to access_point: a radio segment is almost always the
      # edge of the network, and this stops the node re-broadcasting the whole
      # transport network's announces onto the slow RF link. full/gateway are
      # still valid values on this key for anyone who deliberately wants a LoRa
      # backbone — set s.lora.0.mode=gateway by hand — they're just kept out of
      # the picker to avoid people footgunning their airtime.
      - dropdown:
          label: "Mode"
          key: "s.lora.0.mode"
          default: "access_point"
          options:
            - { v: "access_point", l: "Access point" }
            - { v: "roaming",      l: "Roaming" }
            - { v: "boundary",     l: "Boundary" }
      - slider:
          label: "Announce cap %"
          key: "s.lora.0.announce_cap"
          min: 1
          max: 100
          default: 2
      # Transit policy. Auto is what this build always did: the policy is
      # inferred from Mode above, and Route for is not read at all. Off auto,
      # you are stating what this node IS to the nodes on this radio — a
      # gateway that answers and searches for them, or a bare endpoint.
      - switch:
          label: "Set policy manually"
          key: "s.lora.0.policy_manual"
          default: 0
      - caption: "Off = auto: the mode decides and the row below is ignored."
      - switch:
          label: "Route for"
          key: "s.lora.0.route_for"
          default: 0
      # SUPE — unicast traffic leaves the shared channel for short private
      # high-rate detours, negotiated in one seven-byte frame, with rnsd
      # unmodified and unaware (plans/SUPE.md).
      #
      # Everything here defaults ON and `enable` is the one thing that is off:
      # the only decision worth making is whether to speak SUPE at all, and a
      # feature whose switches are all off by default is a feature nobody finds.
      # With `enable` off the interface's on-air behaviour is exactly what it
      # was, which is what makes it one thing to turn off when comparing.
      #
      # The regime is the statement of what is permissible on which channels —
      # the channel raster, the airtime allowance, the length ceilings and the
      # power limit. It also selects which channels the per-second RSSI beat
      # measures and draws, which is all it does with SUPE off.
      #
      # Inert on an interface with an access code: IFAC masks the frame end to
      # end, so the modem cannot read an address to match.
      #
      # Every row here is gated on CONFIG_LORA_NO_SUPE: a build without SUPE has
      # no engine to configure, so it gets no rows, no pane section and no keys
      # in storage — the same gate the code carries, from the same symbol.
      - { section: "SUPE", when_kconfig: "!CONFIG_LORA_NO_SUPE" }
      - switch: { label: "Enable", key: "s.lora.0.SUPE.enable", default: 0 }
        when_kconfig: "!CONFIG_LORA_NO_SUPE"
      - dropdown:
          label: "Regime"
          key: "s.lora.0.SUPE.afa"
          default: 0
          options:
            - { v: 0, l: "0 — Single channel" }
            - { v: 1, l: "1 — EU 863-870, nine channels" }
        when_kconfig: "!CONFIG_LORA_NO_SUPE"
      - switch: { label: "Adaptive TX power", key: "s.lora.0.SUPE.adaptive_txpower", default: 1 }
        when_kconfig: "!CONFIG_LORA_NO_SUPE"
      # Paces everything this node says about itself on its own schedule: the
      # buffered-announce replay, the radio check behind it, and SUPE's own
      # ANNOUNCE2. All three are this straddle's air protocol, which is why the
      # key sits here rather than beside the radio settings.
      #
      # Note this DOES delay Reticulum's own announces — they are buffered and
      # swallowed when rnsd hands them over, and replayed on this beat. 0 turns
      # the beat off entirely, so the node announces only when `lora a` says so;
      # that is a real "never on its own", not a longer interval.
      - slider:
          label: "Announce interval (min)"
          key: "s.lora.0.SUPE.announce_interval"
          min: 0
          max: 240
          default: 30
        when_kconfig: "!CONFIG_LORA_NO_SUPE"
      # RNode endpoint: an RNS RNodeInterface client attaches over USB serial,
      # TCP 7633 and/or Bluetooth (rnode-ble contributes that row into this
      # same section) and shares this radio segment. One switch per door;
      # `.radio` is seeded in lora.cpp. TCP is a switch, not a port number —
      # the client dials 7633 and nothing else.
      - section: "RNode endpoint"
      - switch: { label: "USB serial", key: "s.lora.rnode.serial", default: 1 }
      - switch: { label: "TCP (port 7633)", key: "s.lora.rnode.tcp", default: 0 }
      - section: "Access code"
      - caption: "IFAC: a network name + passphrase every peer on this interface must match, or traffic is dropped. Leave both blank for an open interface."
      - text: { label: "IFAC network", key: "s.lora.0.ifac_netname" }
      - text: { label: "IFAC passphrase", key: "secrets.lora.0.ifac_netkey", secret: true }
      - section: "Status"
      # Every row here shows a string the radio publishes finished — the state
      # in words, the bitrate with its unit, the last reception's quality and
      # the frame counters as one line each.
      - info:
          rows:
            - value: { label: "State", key: "lora.0.state_text" }
            - value: { label: "Chip", key: "lora.0.chip" }
              when_key: lora.0.chip
            - value: { label: "Bitrate", key: "lora.0.bitrate_text" }
            - value: { label: "Last RX", key: "lora.0.rx_text" }
            - value: { label: "Frames", key: "lora.0.traffic" }
