# iface-lora — LoRa interface for reticulous.
#
# Carries the RadioLib ESP-IDF HAL (esp_idf_hal.cpp/h). Owns the radio IRQ
# line; frames RNS packets with a self-contained 1-byte-header split format
# (≤2 LoRa frames per 500-byte packet). Drives up to CONFIG_LORA_COUNT radios
# on one shared SPI bus, each registering with rnsd as lora/<slot>.
#
# Pins + per-radio type come from this component's own Kconfig (LORA_* /
# LORAn_*), resolved from the buildable's sdkconfig. The board sets them in
# its sdkconfig.defaults; staged-but-inert when CONFIG_LORA_COUNT=0.
schema_version: 1
name: reticulous/iface-lora
prefix: rns_lora
version: 0.0.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - reticulous/rns
# Boot-registered Service: LoraService::onInit() self-registers with rnsd via
# ITS; `requires: reticulous/rns` puts rnsd ahead of it in dependency-topo
# order, so its port surface is up first.
services:
  - { class: LoraService, header: lora.h }
  # LoRaMon LCD viewer: an LcdApp, so this entry installs its launcher tile and
  # runs its boot wiring. when:-gated on spangap-lcd — the whole class lives under
  # conditional/spangap-lcd/, so without the lcd straddle staged neither the
  # trampoline nor the class compiles.
  - { class: LoraMonApp, header: loramon_app.h, when: spangap/spangap-lcd }
  # Mono-OLED page: radio state, peers/links, last-frame RSSI/SNR. Lives under
  # conditional/tinylcd/, compiled only when tinylcd is staged.
  - { class: LoraTinyPage, header: lora_tiny.h, when: spangap/tinylcd }

# Browser-side UI registration (parallel to init: above) — auto-wired into
# the buildable SPA via straddles.gen.ts; no web-interface edit needed.
browser_register:
  - call: registerLora
    module: modules/lora

# Declarative settings: both surfaces + radio-0 storage defaults generated from
# this block. Radio 0 only; radios 1.. are seeded by the loop in lora.cpp.
# Frequency + TX power carry no default (region/antenna — the user must pick).
settings:
  - at:
      - { id: reticulum }
      - { id: interfaces }
    order: 4
    rows:
      - heading: "LoRa"
      - caption: "Set frequency and bandwidth directly, pick a spreading factor and coding rate; the radio stays disabled until you enable it."
      - switch: { label: "Enable LoRa", key: "s.lora.0.enable", default: 0 }
      # Everything below is gated on that switch. A disabled radio has no
      # frequency worth setting, no announce beat to schedule and no status to
      # read, and a pane that offers all of it anyway invites an operator to
      # tune a radio that is not listening. The three rows that already carry a
      # gate keep theirs: lora.cpp folds the enable state into `row_*` so each
      # stays a single truthy/empty key (a `when_key` is one key, and the
      # firmware is where two facts become one gate).
      - { section: "Radio", when_key: "s.lora.0.enable" }
      # Frequency/bandwidth are stored in Hz but entered here in MHz/kHz. These
      # rows bind ephemeral display keys, not s.lora.0.*; lora.cpp mirrors the Hz
      # config to them and converts edits back (so any value works, not presets).
      # Bandwidth's s.lora.0.bandwidth default is seeded in lora.cpp, not here.
      - text: { label: "Frequency", unit: "MHz", key: "lora.0.freq_mhz" }
        when_key: "s.lora.0.enable"
      - text: { label: "Bandwidth", unit: "kHz", key: "lora.0.bw_khz" }
        when_key: "s.lora.0.enable"
      # The floor is the part's, not the standard's: an SX127x reaches neither
      # SF5 nor SF6 through this framing, and lora.cpp publishes what its slot's
      # chip can actually run (radioMinSf) so the field offers exactly that.
      - integer: { label: "Spreading Factor (SF)", key: "s.lora.0.spreading_factor",
                   min: { key: "lora.0.sf_min", default: 5 },
                   max: 12, default: 7, buttons: true }
        when_key: "s.lora.0.enable"
      - caption: "Low is fast and short-range, high is slow and long-range."
        when_key: "s.lora.0.enable"
      - dropdown:
          label: "Coding Rate"
          key: "s.lora.0.coding_rate"
          default: 5
          options:
            - { v: 5, l: "4/5" }
            - { v: 6, l: "4/6" }
            - { v: 7, l: "4/7" }
            - { v: 8, l: "4/8" }
        when_key: "s.lora.0.enable"
      # Max is the ceiling this radio can actually reach at the antenna, which
      # only the device knows: femInit detects whether the board's front-end
      # module is really there and publishes the answer — the part's rating
      # (e.g. 27 on the Heltec V4) when it is, the bare SX126x's 22 when it is
      # not. A board that declares a FEM it cannot talk to therefore offers 22
      # rather than a figure nothing will deliver.
      # "Maximum", because that is what the number is: with SUPE on, every
      # frame to a peer we have heard from goes out at a power derived for that
      # peer, and this is the ceiling that derivation is clamped to (INTERNALS
      # §15). With SUPE off nothing derives anything and every frame goes out
      # at exactly this — a maximum that happens always to be reached.
      - integer:
          label: "Maximum TX power"
          unit: "dBm"
          key: "s.lora.0.tx_power"
          min: -9
          max: { key: "lora.0.tx_power_max", default: 22 }
        when_key: "s.lora.0.enable"
      - caption: "The most this radio will ever transmit at, measured at the antenna. Frames to a peer whose signal we have measured go out at whatever reaches it, which is often well below this."
        when_key: "s.lora.0.enable"
      - integer: { label: "Preamble", key: "s.lora.0.preamble", min: 6, max: 32, default: 12 }
        when_key: "s.lora.0.enable"
      - text:   { label: "Sync word", key: "s.lora.0.sync_word", default: "0x42" }
        when_key: "s.lora.0.enable"
      # LNA boosted RX gain: ~+3 dB sensitivity for ~0.4 mA more RX
      # current. On by default; a flag on SX126x, the top gain level on
      # LR2021. Both rows ride `lora.0.row_rx_boost`, which lora.cpp publishes
      # truthy only when the slot's chip answers to the control AND the radio is
      # switched on: a receive control that does nothing is worse than an absent
      # one, since it gets read as an explanation for whatever the radio is
      # doing — and a radio that is off is the plainest case of that.
      - switch: { label: "RX boosted gain", key: "s.lora.0.rx_boosted_gain", default: 1 }
        when_key: "lora.0.row_rx_boost"
      - caption: "About 3 dB more sensitivity for a fraction of a milliamp more while listening. For optimal gain, this might need to be turned off if your hardware uses a pre-amplifier."
        when_key: "lora.0.row_rx_boost"
      # Shown only where the detected front end amplifies on receive (femInit
      # senses it on the pin): with an LNA already in front, the chip's own
      # boost may buy nothing and costs some large-signal headroom, so the
      # honest advice is to try both. Nobody has measured it on this tree.
      - caption: "This board's front end has a receive amplifier of its own, so you may (or may not) actually receive slightly more with this turned off. Try it out."
        when_key: "lora.0.row_fem_note"
      # Analog front-end recalibration. An SX126x that has heard a strong signal
      # can leave its gain control latched and go deaf, and only powering the
      # front end down resets it — so this beat is the one periodic wake the
      # radio task holds without a consumer asking for it. The default matches
      # LORA_AGC_RESET_DEF_S (lora_radio.h); keep the two together.
      - dropdown:
          label: "AGC reset"
          key: "s.lora.0.agc_reset"
          default: 300
          options:
            - { v: 0,   l: "Off" }
            - { v: 60,  l: "Every minute" }
            - { v: 300, l: "Every 5 min" }
            - { v: 900, l: "Every 15 min" }
        when_key: "lora.0.row_agc_reset"
      - caption: "A strong signal can leave this radio's gain control latched and the receiver deaf, and only powering the front end down clears it. This is how often we do that."
        when_key: "lora.0.row_agc_reset"
      # One interval for everything this node says about itself on this radio:
      # the Reticulum announces rnsd replays onto it, and SUPE's own ANNOUNCE2.
      # "How often does this node tell the neighbourhood who it is" is one
      # question and gets one answer — two keys of the same name and the same
      # default were only ever going to be set inconsistently. It is not a SUPE
      # setting and not an application's: applications keep their announce
      # current with rnsd and never schedule anything, because on a radio the
      # cost of saying it is airtime and only the radio knows that.
      - { section: "Announces", when_key: "s.lora.0.enable" }
      - integer: { label: "Announce interval", unit: "min", key: "s.lora.0.announce_interval", min: 0, max: 1440, default: 30 }
        when_key: "s.lora.0.enable"
      - caption: "How often this node tells the air who it is. Every minute of this is airtime nobody else can use, so it is deliberately slow. 0 = only when something changes or you press the button."
        when_key: "s.lora.0.enable"
      - button: { label: "Announce now", do: { set: { key: "lora.0.announce_now", value: 1, edge: true } } }
        when_key: "s.lora.0.enable"
      - when_key: "s.lora.0.enable"
        advanced:
          rows:
            # LoRa defaults to access_point: a radio segment is almost always
            # the edge of the network, and this stops the node re-broadcasting
            # the whole transport network's announces onto the slow RF link.
            # full/gateway are still valid values on this key for anyone who
            # deliberately wants a LoRa backbone — set s.lora.0.mode=gateway by
            # hand — they're just kept out of the picker to avoid people
            # footgunning their airtime.
            - dropdown:
                label: "Interface mode"
                key: "s.lora.0.mode"
                default: "access_point"
                options:
                  - { v: "access_point", l: "Access point" }
                  - { v: "roaming",      l: "Roaming" }
                  - { v: "boundary",     l: "Boundary" }
            - integer: { label: "Community Radius", key: "s.lora.0.community_radius", min: 0, max: 7, default: 3 }
            - caption: "Nodes within this many hops on this radio are yours: their announces are kept and answered for, searches run on their behalf, and only their announces are re-broadcast onto the air. Everyone else is still heard and reachable on demand."
            - integer:
                label: "Announce cap"
                unit: "%"
                key: "s.lora.0.announce_cap"
                min: 1
                max: 100
                default: 2
            - section: "Interface access code (IFAC)"
            - caption: "A network name + passphrase every peer on this interface must match, or traffic is dropped. Leave both blank for an open interface."
            - text: { label: "IFAC network", key: "s.lora.0.ifac_netname" }
            - text: { label: "IFAC passphrase", key: "s.lora.0.ifac_netkey", secret: true }
      # SUPE — unicast traffic leaves the shared channel for short private
      # high-rate detours, negotiated in one seven-byte frame, with rnsd
      # unmodified and unaware (plans/SUPE.md).
      #
      # Everything here defaults ON and `enable` is the one thing that is off:
      # the only decision worth making is whether to speak SUPE at all, and a
      # feature whose switches are all off by default is a feature nobody finds.
      # With `enable` off the interface's on-air behaviour is exactly what it
      # was, which is what makes it one thing to turn off when comparing.
      #
      # The regime is the statement of what is permissible on which channels —
      # the channel raster, the airtime allowance, the length ceilings and the
      # power limit. It also selects which channels the per-second RSSI beat
      # measures and draws, which is all it does with SUPE off.
      #
      # Inert on an interface with an access code: IFAC masks the frame end to
      # end, so the modem cannot read an address to match.
      #
      # Every row here is gated on CONFIG_LORA_NO_SUPE: a build without SUPE has
      # no engine to configure, so it gets no rows, no pane section and no keys
      # in storage — the same gate the code carries, from the same symbol.
      - { section: "SUPE", when_kconfig: "!CONFIG_LORA_NO_SUPE", when_key: "s.lora.0.enable" }
      - switch: { label: "Enable SUPE", key: "s.lora.0.SUPE.enable", default: 0 }
        when_kconfig: "!CONFIG_LORA_NO_SUPE"
        when_key: "s.lora.0.enable"
      - dropdown:
          label: "Regime"
          key: "s.lora.0.SUPE.afa"
          default: 0
          options:
            - { v: 0, l: "0 — Single channel" }
            - { v: 1, l: "1 — EU 863-870, nine channels" }
        when_kconfig: "!CONFIG_LORA_NO_SUPE"
        when_key: "s.lora.0.enable"
      - { section: "Status", when_key: "s.lora.0.enable" }
      # Every row here shows a string the radio publishes finished — the state
      # in words, the bitrate with its unit, the last reception's quality and
      # the frame counters as one line each.
      - when_key: "s.lora.0.enable"
        info:
          rows:
            - value: { label: "State", key: "lora.0.state_text" }
            - value: { label: "Chip", key: "lora.0.chip" }
              when_key: lora.0.chip
            - value: { label: "Bitrate", key: "lora.0.bitrate_text" }
            - value: { label: "Last RX", key: "lora.0.rx_text" }
            - value: { label: "Frames", key: "lora.0.traffic" }

  # The RNode endpoint is its own thing: an RNS RNodeInterface client attaches
  # over USB serial, TCP 7633 and/or Bluetooth (rnode-ble contributes the
  # Bluetooth rows here) and shares this radio segment. It sat as a section of
  # the LoRa pane, where it read as a radio setting; it is a door onto the
  # radio, with its own transports to name, so it gets a menu.
  - at:
      - { id: reticulum }
      - { id: rnode, label: "RNode", short: "RNode", order: 5 }
    rows:
      - title: "RNode"
      - caption: "Lets an RNS client — Sideband, MeshChat, anything speaking RNodeInterface — attach to this device and share the radio."
      - heading: "Connect via"
      - switch: { label: "USB serial", key: "s.lora.rnode.serial", default: 1 }
      - switch: { label: "TCP (port 7633)", key: "s.lora.rnode.tcp", default: 0 }
      # Only in builds that stage upnp, and only while the TCP door is open —
      # the gate is the ephemeral key lora_rnode.cpp publishes from the switch,
      # not the switch's own key. Default off: the serial and Bluetooth doors
      # are on the operator's desk, but this one puts the radio on the public
      # internet, and that is a decision rather than a convenience.
      - switch: { label: "Accessible from internet", key: "s.lora.rnode.upnp", default: 0 }
        when_kconfig: "CONFIG_SPANGAP_UPNP"
        when_key: lora.rnode.tcp_on
      - caption: "Turn this on to add this port to the list of ports forwarded to this device via UPnP."
        when_kconfig: "CONFIG_SPANGAP_UPNP"
        when_key: lora.rnode.tcp_on
